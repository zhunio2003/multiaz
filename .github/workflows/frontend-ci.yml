name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/admin-web-app/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/admin-web-app/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend/admin-web-app

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm 
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/admin-web-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test --run
