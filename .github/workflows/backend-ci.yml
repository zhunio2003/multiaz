name: Backend CI

on:
  push:
    branches: [main]
    paths: 
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request: 
    branches: [main]
    paths: 
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven  
      
      - name: Run tests on auth service
        run: mvn test -f backend/core/auth-service/pom.xml

      - name: Run tests on model-registry
        run: mvn test -f backend/core/model-registry/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build config-service
        run: docker build -t config-service ./backend/infrastructure/config-service

      - name: Build service-discovery
        run: docker build -t service-discovery ./backend/infrastructure/service-discovery