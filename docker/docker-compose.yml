services:

  config-service: 
    build:
       context: ../backend/infrastructure/config-service/
       dockerfile: Dockerfile
    container_name: config_service_multiaz
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
    networks:
      - net-gateway
    volumes:
      - ../config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
  service-discovery:
    build: 
      context: ../backend/infrastructure/service-discovery/
      dockerfile: Dockerfile
    container_name: service_discovery_multiaz
    ports:
      - "8761:8761"
    networks:
      - net-gateway
      - net-prediction
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  

  # CORES
  api-gateway:
    build: 
      context: ../backend/core/api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway_multiaz
    ports:
      - "8080:8080"
    networks:
      - net-gateway
    depends_on:
      config-service:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
  auth-service:
    build:
      context: ../backend/core/auth-service
      dockerfile: Dockerfile
    container_name: auth_service_multiaz
    ports:
      - "8081:8081"
    environment:
      - AUTH_DB_USER=${AUTH_DB_USER}
      - POSTGRES_AUTH_PASS=${POSTGRES_AUTH_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=dev
      - REDIS_PASS=${REDIS_PASS}
    networks:
      - net-gateway
      - net-database
    depends_on:
      config-service:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
  model-registry:
    build: 
      context: ../backend/core/model-registry
      dockerfile: Dockerfile
    container_name: model_registry_multiaz
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - net-gateway
      - net-database
    depends_on:
      config-service:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget","-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  prediction-orchestrator:
    build:
      context: ../backend/core/prediction-orchestrator
      dockerfile: Dockerfile
    container_name: prediction_orchestrator_multiaz
    ports:
      - "8084:8084"
    environment:
      - POSTGRESQL_USER=${POSTGRESQL_USER}
      - POSTGRESQL_PASS=${POSTGRESQL_PASS}
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - net-gateway
      - net-database
    depends_on:
      config-service:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget","-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MESSAGES
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq_multiaz
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - vol-rabbitmq:/var/lib/rabbitmq
    networks:
      - net-message
  
  # STORAGE
  redis:
    image: redis:8
    container_name: redis_multiaz
    environment:
      - REDIS_PASSWORD=${REDIS_PASS}
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASS}"]
    volumes:
      - vol-redis:/data
    networks:
      - net-database

  postgresql:
    image: postgres:17
    container_name: postgresql_multiaz
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRESQL_USER}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_AUTH_PASS=${POSTGRES_AUTH_PASS}
      - POSTGRES_MODEL_REGISTRY_PASS=${POSTGRES_MODEL_REGISTRY_PASS}
      - POSTGRES_PREDICTION_ORCHESTRATOR_PASS=${POSTGRES_PREDICTION_ORCHESTRATOR_PASS}
      - POSTGRES_SCHEDULER_PASS=${POSTGRES_SCHEDULER_PASS}
      - POSTGRES_DATASET_MANAGEMENT_PASS=${POSTGRES_DATASET_MANAGEMENT_PASS}
      - POSTGRES_NOTIFICATION_PASS=${POSTGRES_NOTIFICATION_PASS}
      
    volumes:
      - vol-postgresql:/var/lib/postgresql/data
      - ../scripts/postgres/init-databases.sh:/docker-entrypoint-initdb.d/initdatabases.sh
    networks:
      - net-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  mongodb:
    image: mongo:8
    container_name: mongodb_multiaz
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASS}
    volumes:
      - vol-mongodb:/data/db
    networks:
      - net-database
  
  minio:
    image: minio/minio:latest
    container_name: minio_multiaz
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - vol-minio:/data
    networks:
      - net-database
  
  # MAIL
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_multiaz
    ports:
      - "1025:1025" # STMP (Enviar email)
      - "8025:8025" # Web interface
    networks:
      - net-database
  
  # BACKUP
  backup:
    build: 
      context: ../
      dockerfile: backend/infrastructure/backup-service/Dockerfile
    container_name: backup_multiaz
    environment:
      - POSTGRESQL_USER=${POSTGRESQL_USER}
      - POSTGRESQL_PASS=${POSTGRESQL_PASS}
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASS=${MONGODB_PASS}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASS=${MINIO_PASS}
    networks:
      - net-database
    depends_on:
      postgresql:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_started
      

volumes:
  vol-rabbitmq:
    driver: local
  vol-redis:
    driver: local
  vol-postgresql:
    driver: local
  vol-mongodb:
    driver: local
  vol-minio:
    driver: local

networks:
  net-gateway:
    driver: bridge
  net-prediction:
    driver: bridge
  net-message:
    driver: bridge
  net-database:
    driver: bridge
