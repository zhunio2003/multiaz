spring:
  application:
    name: api-gateway
  config: 
    import: optional:configserver:http://config-service-multiaz:8888
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-register
              uri: lb://auth-service
              predicates:
                - Path=/auth/register
            - id: auth-login
              uri: lb://auth-service
              predicates:
                - Path=/auth/login
            - id: auth-recovery
              uri: lb://auth-service
              predicates:
                - Path=/auth/recovery
            - id: auth-protected
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: models
              uri: lb://model-registry
              predicates:
              - Path=/models/**
            - id: prediction-orchestrator
              uri: lb://prediction-orchestrator
              predicates:
                - Path=/predictions/**

server: 
  port: 8080


